[project]
name = "jdssarrow"
version = "0.1.0"
description = "Reference implementation of the Joint Dismounted Soldier System (STANAG 4677 / AEP-76, 5 volumes) with web config and monitoring."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "benoit" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "lxml>=5.2",
    "pyarrow>=16.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
# The external PyQt6 simulator app (see simulator/). Optional: the library and web app
# don't need it; install with `uv pip install -e ".[sim]"` to run `python -m simulator`.
sim = [
    "PyQt6>=6.6",
]

[project.scripts]
jdssarrow = "jdssarrow.cli:main"

# Default implementations for every extension point are advertised as plugins.
# Third parties can ship their own by registering additional entry points in
# the same group; jdssarrow.plugins.registry discovers them at runtime.
[project.entry-points."jdssarrow.codecs"]
xml = "jdssarrow.datamodel.codec.xml_mip:XmlMipCodec"
json = "jdssarrow.datamodel.codec.json_codec:JsonCodec"
arrow = "jdssarrow.datamodel.codec.arrow_codec:ArrowCodec"

[project.entry-points."jdssarrow.transports"]
loopback = "jdssarrow.iem.transport_loopback:LoopbackTransport"
udp = "jdssarrow.iem.transport_udp:UdpMulticastTransport"

[project.entry-points."jdssarrow.security"]
null = "jdssarrow.security.provider:NullSecurity"
psk = "jdssarrow.security.provider:PreSharedKeySecurity"

[project.entry-points."jdssarrow.bearers"]
simulated = "jdssarrow.loanedradio.bearer:SimulatedRadio"

[project.entry-points."jdssarrow.allocators"]
default = "jdssarrow.networkaccess.allocator:DefaultAddressAllocator"

# Simulator client personas — JDSS-compliant role behaviours.
[project.entry-points."jdssarrow.policies"]
allow_all = "jdssarrow.connections.policy:AllowAllPolicy"
matrix = "jdssarrow.connections.policy:MatrixConnectionPolicy"

[project.entry-points."jdssarrow.profiles"]
rifleman = "jdssarrow.simulator.profiles:Rifleman"
teamleader = "jdssarrow.simulator.profiles:TeamLeader"
medic = "jdssarrow.simulator.profiles:Medic"
scout = "jdssarrow.simulator.profiles:Scout"
observer = "jdssarrow.simulator.profiles:ForwardObserver"
sensor = "jdssarrow.simulator.profiles:UavSensor"
commandpost = "jdssarrow.simulator.profiles:CommandPost"
atak = "jdssarrow.simulator.profiles:AtakEud"
vehicle = "jdssarrow.simulator.profiles:Vehicle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdssarrow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the intended idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
packages = ["jdssarrow"]
mypy_path = "src"
ignore_missing_imports = true
